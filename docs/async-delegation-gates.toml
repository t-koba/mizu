# Runtime-loaded parent-access policy and remaining integration contract.
# Loaded only for a trusted injected reservation view, never for ordinary calls.
# Context gates plus admission/maintenance fences are partial; do not enable a
# runner until every entrypoint is gated and authority/quiescence evidence passes.
# View schema: {id: SHA256, owner: role, status: reserved_statuses entry,
# request: {source_snapshot: SHA256}}; extra trusted store fields are ignored.
# None preserves ordinary access; every malformed/unknown or non-owner view
# denies all operations. The private admitted-parent handoff refreshes this
# view under the Context dispatch mutex; ordinary calls do not read the store.
# Only this explicit bridge-protocol set is permitted; other callbacks deny.
version = 1
status = "pre-integration-gates"
runner_integration_allowed = false
unknown_reservation = "treat-as-held"
reserved_statuses = ["queued", "running", "cancel-requested"]
terminal_execution_still_reserved = true
release_status = "terminal-after-proven-quiescence"

# The parent can keep using only these proven non-tree Context operations.
parent_control_plane = [
  "fetch", "probe", "search", "insights", "decision_read", "record_read",
  "work_items_read", "work_items_legacy_read", "work_items_reconcile",
  "work_items_create", "work_items_transition", "work_order", "decide",
  "submit_insight", "revise_insight", "withdraw_insight", "attach_evidence",
  "research_read", "research",
]

# Bridge protocol needed to run a parent control-plane turn. Native tool
# preflight (_engine_tool) is deliberately absent and remains denied.
parent_transport = ["_hello", "_budget", "_model_usage", "_request_done"]

# diff uses the immutable Context snapshot. consult requires source_snapshot
# equal to the reservation source and loads that exact retained manifest for
# both consultation and selector preview, without live capture or parent close.
# source_snapshot is forbidden without a trusted reservation.
parent_snapshot_only = ["diff", "consult"]

# finish remains denied. A future dedicated wait path must bind this exact job
# and skip ordinary workspace bounds/final capture; the current API cannot.
parent_exact_job_wait = ["finish"]

# Deny the rest of Context._DISPATCH while the parent is reserved. Unknown
# operations and unsupported parameter values fail closed as well.
parent_denied = [
  "files", "read", "command_evidence_read", "experiment_evidence_read",
  "exec", "experiment", "verify", "check_job", "sync", "vcs_publish",
  "vcs_request", "vcs_retire", "vcs_dispose", "materialize", "delegate",
  "report", "record_write",
]

[parameterized.vcs_read]
allow = ["status", "publications", "ci_requests", "ci_costs"]
default = "deny"

[requirements]
diff = "Use only the parent's immutable context snapshot, and require its identity to equal reservation.request.source_snapshot."
consult = "Require explicit source_snapshot equal to reservation.request.source_snapshot; retrieve and validate that exact retained manifest for consultation and selector preview. Missing, malformed or identity-mismatched manifests deny. Never capture/read parent.workspace or close its execution while reserved; source_snapshot is forbidden without a reservation."
finish = "Only outcome=wait with an exact wait job id equal to the active reservation; bypass all live-tree bounds/captures on that path. Current API has no such delegation wait field, so it is not yet available."
vcs_read = "Only the listed read-only status/evidence suboperations; every other or malformed suboperation is denied."
native_tools = "Deny parent native engine-tool calls, regardless of role grants, while reserved."
external_mcp = "Disable parent MCP servers that see context.workspace; a read-only live mount can still observe partial child edits. A future exception requires an exact immutable snapshot mount."
driver = "A parent model turn is allowed only with the control-plane Context gate active, no live-workspace native/MCP access, and a pinned or no-workspace working directory."

[entrypoints]
# Every route below needs the reservation check before reading, writing,
# capturing, or launching anything against the live workspace.
parent_live_tree_gates = [
  "Context.handle/dispatch before handler side effects",
  "Context._engine_tool before native adapter execution",
  "Engine.run continuation workspace comparison capture after admission",
  "Engine.run final capture and finish bounds",
  "Engine.consult parent.workspace capture",
  "Engine.delegate child invocation on parent.workspace",
  "check_jobs.available source capture",
  "sandbox exec/experiment/verify",
  "materialize.apply",
  "vcs_publish source capture",
  "configured MCP containers mounted at context.workspace",
  "adapter native-tool callbacks in Claude and Pi",
  "Codex configured MCP servers and engine_tools refusal",
  "Pi-durable native-tool and MCP refusal",
  "persistent execution containers",
]
parent_live_tree_action = "Refuse every live-tree call; allow only an explicitly pinned immutable input whose identity matches the reservation source."
external_workspace_entrypoints = [
  "Project.initialize source capture when source resolves under a managed project workspace",
  "Project.initialize recursive source capture from a managed project root (including resolved aliases)",
]
external_workspace_action = "Refuse import from an actively reserved workspace or import a previously pinned immutable snapshot; do not assume an arbitrary source path is external."

# Reservation must also exclude other writers and maintenance, not only model
# tool calls. Use one lock order and check before any preliminary capture.
reservation_exclusion = [
  "Engine._admit writable workspace lock",
  "storage.quiescent backup/restore/collection",
  "storage.maintain_automatic_prune snapshot/run retention",
  "workspace_cache.maintain",
  "probes.service_due role/workspace lock",
  "new check-job source discovery",
]
reservation_exclusion_action = "Use the same durable reservation/lock check before any workspace access; never rely on a later check after capture."

# The durable reservation remains held through these identities' teardown and
# descendant reconciliation; process-main exit or a stop request is not proof.
quiescence_required = [
  "child run and driver process tree",
  "bridge and all subprocess descendants",
  "MCP/OCI containers bound to the child run",
  "persistent execution containers",
]
quiescence_release_rule = "Keep the reservation through cancellation, supervisor death, and all descendant reconciliation; uncertain proof never releases it."

# Inventory gaps that must be closed before runner integration or a pilot.
not_yet_proven = [
  "Engine.run binds a scoped parent gate and the admitted handoff binds resolved child configuration in the immutable queued request; actual runner integration with supervisor-only directory/resources remains absent.",
  "Driver quiescence only observes the direct process and reader threads; production descendant/container recovery after supervisor death remains absent. A private callback-only Linux handback coordinator is exercised by the synthetic smoke, not by a runner or adapter.",
  "External MCP names are recorded in run configuration, but crash-time server/container reconciliation is absent.",
  "Admitted-parent lease handoff commits and refreshes the Context gate, but has no model entrypoint, exact-job wait, child launch or runner integration.",
]

[child_authority]
reservation_handoff = "Groundwork only: Engine.run mints a project/role/Engine/Context-scoped lease under write admission, revokes it via the run ExitStack before lock release, and reuses that lock for one exact start or retry. Engine._reserve_delegation refreshes the minimum trusted store projection under the parent dispatch mutex even on uncertain acknowledgement; unreadable refresh denies all calls. The shared read-only resolver binds the resolved profile and child_authority_digest atomically with full effective settings/resources, composed policy, pinned goal/workspace, adapter/local-settings digests and caller shared-spend authority. Queued admission and recovery use the exact retained source manifest; recovery needs only trusted owner plus immutable digest-bearing request, re-resolves current authority, and refuses legacy/drift without store mutation. The owner must retain its delegate grant. Synchronous delegation keeps its prior published-current selector input. The parent gate omits task/token/digest. This binds configuration only and launches nothing."
required_bindings = [
  "exact source snapshot",
  "effective role grants and tool limits",
  "adapter options and native/MCP tool configuration",
  "relevant policy/configuration inputs",
  "child run identity and writable container identities",
]
mismatch_action = "Refuse launch: the owner must retain its delegate grant and runner_bind/runner_started require an explicitly supplied freshly resolved matching authority_digest, not a copied saved hash. Missing/mismatched authority refuses without clearing reservations; never infer equivalence from role/profile names."
legacy_requests = "Schema v4 preserves old four-field requests and tombstones for inspection/exact retry and cleanup recovery, without reset or upgrade; legacy requests cannot be authority-resolved or gain launch bindings/claims. Existing resource identities/intents remain cleanup-recovery evidence. Earlier schema versions remain refused without modification."
remaining_authority_gaps = [
  "Mutable executable/PATH, installed SDK/runtime and ambient environment/home configuration.",
  "Agent-directory content beyond local models.json; credentials and remote provider/MCP grants.",
  "Container image/mount/seccomp content and atomic use of resolved inputs at launch.",
  "Concurrent model-slot admission, exact-job wait and durable process/container descendant quiescence.",
]

[observed_lifecycle]
workspace_start = "DelegationJobs.workspace_start takes workspace.lock nonblocking before checking existing state and yielding a store for trusted capture/start. It retains the lock through durable start and releases only the process lock on exceptions; uncertain commits stay reserved. This is a host critical section, not an admitted-parent lease transfer, runtime runner or quiescence proof."
project_initialize = "Creates a staged new project and refuses overwrite. Managed workspace imports (including resolved aliases and lexical escape attempts) and exact managed project-root imports take the source workspace.lock before the non-initializing DelegationJobs.guard and retain it through source inspection and clone/copy. Collection-level sources that include managed projects fail closed rather than choosing one lock. Active, corrupt, incomplete, unsafe or unreadable state refuses before target publication; ordinary external-directory imports are unchanged. These guards prove source-import serialization only; they do not prove runtime reservation wiring, child authority or process/container quiescence."
project_restore = "Restores from an archive into a new unarmed project and refuses an existing destination; backup creation uses storage.quiescent before capture."
probe = "probes.service_due uses a per-probe empty workspace and acquires workspace.lock for write roles; reservation must exclude this lock participant."
automatic_prune = "Called before run admission; prune/snapshot collection enters storage.quiescent and its workspace exclusion."
driver_channel = "EngineChannel.close terminates the spawned process group/Job Object, joins pipe readers, and attempts normal MCP cleanup; Channel.quiescent checks direct process exit and reader threads, not descendant or container membership."
mcp_containers = "connected_servers generates random container names and holds cleanup names in memory; adapter effective configuration records the generated command before driver execution, but no supervisor-death reaper was found."
sandbox_containers = "One-shot and persistent exec write command-start evidence with generated container names before launch; sandbox labels include project/role/run. Normal teardown removes by name, but no reservation-bound crash reconciler was found."
job_store = """
DelegationJobs schema v4 adds a single-container provisioning intent beside the
supervisor-only directory/resource binding. Both share the 8 KiB
active-inventory allowance plus 14 bytes per job for the explicit intent field
and clear atomically on terminal handback; older
ledger versions are refused, not migrated or reset. Within v4, the optional
request authority_digest participates in the exact immutable request fingerprint;
old requests remain readable/retryable/recoverable but cannot bind/claim a runner.
New bindings/claims require an explicit matching resolved digest. The ledger
ceiling adds exactly 86 canonical UTF-8 bytes for authority_digest in the single
active request (comma + quoted key + colon + quoted 64-hex value); terminal
handback clears requests, so no per-tombstone allowance is added. All other caps
are unchanged. The module documents the contract.
The synthetic fixture persists a bounded safe name, UID, run-id marker,
immutable image ID and expected inspection config before Podman create; only the
persisted intent is recovery authority and the marker alone pins run_id. The
normal path then verifies exactly one name/label candidate and its exact
image/config/prelaunch state before binding its ID and claiming the runner, so a
retagged or substituted image cannot be claimed. Unbound or unclaimed-bound
recovery first durably fences bind/claim/finish; a claim bit survives cancellation.
It requires an unstarted systemd scope, identical singleton name/label inventories,
exact ID/name/label/image/config and never-started container state. The validated
ID is persisted before non-force removal; positive name/ID/marker absence permits
handback, including after an interrupted removal. Missing initial candidates,
renames, duplicates, malformed, mismatched, wrong-UID or unobservable evidence
retain the hold without removing a substitute. Bounded command errors/overflow
are unknown, never absence. The live smoke proves both a real pre-binding
interruption (prepare plus create, then a separate recovery CLI seals cleanup
and terminalization under its own key and exact ledger IDs) and the existing
bound supervisor-death path. The fixture provisioner must be stopped and external
create commands settled before recovery; this is not a fence against unrelated
Podman clients. Normal execution does not import the binding into Engine.run;
Engine/CLI/adapter launch integration remains disabled.
That synthetic smoke uses real systemd/cgroup v2 and rootless Podman, including
a setsid descendant surviving supervisor death. Bound recovery calls the private
`delegation_recovery` coordinator: before callbacks it requires the active token,
exact immutable binding, terminal execution report and host attestations of a
one-shot launch fence and settled supervisor. It calls `delegation_scope` for
the inactive/absent unit and empty/consistently absent cgroup, then requires each
exact saved name/ID/UID positively absent through a host-owned OCI reconciliation
callback before submitting `runner_quiescent` with the original full inventory.
Host callbacks own bounded queries, cleanup, the existing rootless namespace and
retry safety; Mizu executes no host commands. Unknown proof or interrupted cleanup
retains the reservation; retries reinspect all resources, and an uncertain final
commit is resolved from ledger status. Test-only host commands still own cleanup.
The bounded synthetic smoke exercises this coordinator but does not establish
Windows/macOS scope proof, a product container reaper, runner/launch or production
host/adapter integration, production quiescence, authority, handoff or pilot
readiness.
"""
process_group_experiment = "A bounded Linux sandbox reproduction observed a setsid descendant survive SIGTERM to its parent's process group; a direct signal then stopped it. This is not a systemd/cgroup, OCI, or Windows recovery smoke."
