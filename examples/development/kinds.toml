# Example userland kinds. Include from a deployment configuration:
#   include = ["<path>/examples/development/kinds.toml"]
# Principals: role:<name>, host, operator; author and holder resolve per object.

# A check run by the host's check runner; its result is evidence for other kinds.
[kinds.check]
states = ["running", "passed", "failed", "cancelled"]
initial = "running"
create = ["host"]
fields.snapshot = {type = "string", max = 64, required = true}
fields.commands = {type = "list", item = {type = "string", max = 4096}, max_items = 32}
[[kinds.check.transitions]]
name = "pass"
from = ["running"]
to = "passed"
by = ["host"]
[[kinds.check.transitions]]
name = "fail"
from = ["running"]
to = "failed"
by = ["host"]
[[kinds.check.transitions]]
name = "cancel"
from = ["running"]
to = "cancelled"
by = ["host"]

# A proposal addressed to a holder, decided by that holder, and closed by the
# holder when its end state holds (or is abandoned/superseded).
[kinds.proposal]
states = ["pending", "accepted", "deferred", "rejected", "fulfilled", "superseded", "withdrawn"]
initial = "pending"
create = ["role:writer", "role:reviewer", "role:auditor", "role:searcher", "operator"]
fields.title = {type = "string", max = 240, required = true}
fields.body = {type = "string", max = 65536, required = true}
fields.holder = {type = "principal", required = true}
fields.reason = {type = "string", max = 8192}
fields.revisit = {type = "instant", event = "proposal.revisit"}
[[kinds.proposal.transitions]]
name = "accept"
from = ["pending", "deferred"]
to = "accepted"
by = ["holder"]
fields = ["reason"]
requires = [{field = "reason", present = true}]
[[kinds.proposal.transitions]]
name = "defer"
from = ["pending"]
to = "deferred"
by = ["holder"]
fields = ["reason", "revisit"]
requires = [{field = "reason", present = true}]
[[kinds.proposal.transitions]]
name = "reject"
from = ["pending", "deferred"]
to = "rejected"
by = ["holder"]
fields = ["reason"]
requires = [{field = "reason", present = true}]
[[kinds.proposal.transitions]]
name = "fulfil"
from = ["accepted"]
to = "fulfilled"
by = ["holder"]
fields = ["reason"]
requires = [{field = "reason", present = true}]
[[kinds.proposal.transitions]]
name = "supersede"
from = ["pending", "accepted", "deferred"]
to = "superseded"
by = ["holder", "author"]
fields = ["reason"]
[[kinds.proposal.transitions]]
name = "withdraw"
from = ["pending", "deferred"]
to = "withdrawn"
by = ["author"]
fields = ["reason"]

# The insight/proposal lifecycle and its separate, immutable decisions.
# An insight is submitted by a configured role (or the operator) and names the
# addressed holder in `holder` (the addressee). `urgency` is a bounded string;
# the kernel does not define or enforce a vocabulary for it. Only the addressed
# holder may decide. Only the author may revise (which makes the insight pending
# again at a new revision) or withdraw. A deferral may carry an aware revisit
# instant, fired once as an event.
[kinds.insight]
states = ["pending", "accepted", "modified", "deferred", "rejected", "withdrawn"]
initial = "pending"
create = ["role:writer", "role:reviewer", "role:auditor", "role:searcher", "operator"]
fields.title = {type = "string", max = 240, required = true}
fields.body = {type = "string", max = 65536, required = true}
fields.holder = {type = "principal", required = true}
fields.urgency = {type = "string", max = 16}
fields.revisit_at = {type = "instant", event = "insight.revisit"}
[[kinds.insight.transitions]]
name = "accept"
from = ["pending", "deferred"]
to = "accepted"
by = ["holder"]
[[kinds.insight.transitions]]
name = "modify"
from = ["pending", "deferred"]
to = "modified"
by = ["holder"]
[[kinds.insight.transitions]]
name = "defer"
from = ["pending"]
to = "deferred"
by = ["holder"]
fields = ["revisit_at"]
requires = [{field = "revisit_at", present = true}]
[[kinds.insight.transitions]]
name = "reject"
from = ["pending", "deferred"]
to = "rejected"
by = ["holder"]
[[kinds.insight.transitions]]
name = "revise"
from = ["pending", "accepted", "modified", "deferred", "rejected"]
to = "pending"
by = ["author"]
fields = ["title", "body", "urgency"]
[[kinds.insight.transitions]]
name = "withdraw"
from = ["pending", "deferred"]
to = "withdrawn"
by = ["author"]

# A decision is a separate create-only record, never edited in place. The host
# writes it after the addressed holder's transition above; the operator may also
# write one. `insight` must name an existing insight object: the kernel checks
# the declared ref kind when the decision is created. `revision` is a positive
# integer, `reason` is required and bounded, and `action` must be one of its
# declared values: accept/modify/defer/reject. `scope` and `revisit` are bounded
# but otherwise unconstrained; their meaning is this declaration's policy, not
# kernel code.
[kinds.decision]
states = ["recorded"]
initial = "recorded"
create = ["host", "operator"]
created_event = "decision.recorded"
fields.insight = {type = "ref", kinds = ["insight"], required = true}
fields.revision = {type = "integer", min = 1, required = true}
fields.action = {type = "string", max = 32, required = true, values = ["accept", "modify", "defer", "reject"]}
fields.reason = {type = "string", max = 8192, required = true}
fields.scope = {type = "string", max = 65536}
fields.revisit = {type = "instant", event = "decision.revisit"}

# Stage-2 userland declarations for the kernel migration. These kinds prove the
# declared mechanism in tests; no production role routes questions, answers or
# notices through them yet.

# A question may carry either an insight ref or a record subject (kind, id and
# content digest). Choosing the applicable shape, and the meaning of an answer,
# is userland policy: the kernel only checks types, refs and transitions.
[kinds.question]
states = ["pending", "answered", "withdrawn"]
initial = "pending"
create = ["role:writer", "role:reviewer", "role:auditor", "role:searcher", "operator", "host"]
created_event = "question.created"
fields.subject_type = {type = "string", max = 64, required = true, values = ["insight", "record"]}
fields.subject_ref = {type = "ref", kinds = ["insight"]}
fields.subject_rev = {type = "integer", min = 1}
fields.record_kind = {type = "string", max = 64}
fields.record_id = {type = "string", max = 256}
fields.record_digest = {type = "digest"}
fields.body = {type = "string", max = 65536, required = true}
fields.urgency = {type = "string", max = 16}
[[kinds.question.transitions]]
name = "answer"
from = ["pending"]
to = "answered"
by = ["host", "operator"]
[[kinds.question.transitions]]
name = "withdraw"
from = ["pending"]
to = "withdrawn"
by = ["author"]

# An answer is a separate, create-only record for one question revision. The
# kernel checks the ref, positive revision and action vocabulary; the host or
# operator decides what action to record.
[kinds.answer]
states = ["recorded"]
initial = "recorded"
create = ["host", "operator"]
created_event = "answer.recorded"
fields.question = {type = "ref", kinds = ["question"], required = true}
fields.revision = {type = "integer", min = 1, required = true}
fields.action = {type = "string", required = true, values = ["publish", "withdraw", "supersede"]}
fields.body = {type = "string", max = 65536, required = true}
fields.reference = {type = "string", max = 256}

# A create-only notification about a content digest; the kind and urgency
# vocabularies belong to the declaring userland, not to kernel code.
[kinds.notice]
states = ["recorded"]
initial = "recorded"
create = ["host", "operator"]
created_event = "notice.recorded"
fields.subject_digest = {type = "digest", required = true}
fields.kind = {type = "string", max = 64, required = true}
fields.body = {type = "string", max = 65536, required = true}
fields.urgency = {type = "string", max = 16}
fields.reference = {type = "string", max = 256}
