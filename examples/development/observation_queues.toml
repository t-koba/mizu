# Example userland observation queues (docs/kernel.md, docs/os-migration.md stage 5).
# Include from a deployment configuration alongside queues.toml. The bodies are
# the plain objects a driver reports; the kernel validates only these bounds and
# required fields and assigns no meaning to them. Declaring a queue changes no
# runtime authority: the cost projection now comes from the declared ci_costs
# driver, while the remaining dedicated version-control and CI code stays
# authoritative until the later cutover and deletion slices.

[queues.vcs_observations]       # what a driver observed in version control
write = ["host"]
read = ["role:*", "operator"]
wake = ["role:worker"]
[queues.vcs_observations.schema]
driver = {type = "string", max = 80, required = true}
kind = {type = "string", max = 80, required = true}
summary = {type = "string", max = 4096, required = true}
observed_at = {type = "instant", required = true}
digest = {type = "digest"}
detail = {type = "string", max = 16384}

[queues.ci_observations]        # what a driver observed in continuous integration
write = ["host"]
read = ["role:*", "operator"]
wake = ["role:worker"]
[queues.ci_observations.schema]
driver = {type = "string", max = 80, required = true}
kind = {type = "string", max = 80, required = true}
summary = {type = "string", max = 4096, required = true}
observed_at = {type = "instant", required = true}
digest = {type = "digest"}
detail = {type = "string", max = 16384}

# Prompt-time head-state and summary observations are readable facts, not
# wake admissions; each keeps only the newest observation owned by its driver.
[queues.ci_head_state_observations] # what a driver observed about CI branch heads
write = ["host"]
read = ["role:*", "operator"]
retain_last = 1
[queues.ci_head_state_observations.schema]
driver = {type = "string", max = 80, required = true}
kind = {type = "string", max = 80, required = true}
summary = {type = "string", max = 4096, required = true}
observed_at = {type = "instant", required = true}
digest = {type = "digest"}
detail = {type = "string", max = 1048576}

[queues.ci_summary_observations] # what a driver observed about CI aggregates
write = ["host"]
read = ["role:*", "operator"]
retain_last = 1
[queues.ci_summary_observations.schema]
driver = {type = "string", max = 80, required = true}
kind = {type = "string", max = 80, required = true}
summary = {type = "string", max = 4096, required = true}
observed_at = {type = "instant", required = true}
digest = {type = "digest"}
detail = {type = "string", max = 1048576}
