# Example userland queues (docs/kernel.md). Include from a deployment configuration.
# Queue names, schemas and who reads or writes them are this example's choices;
# what a reader does with a message is written in policies/messages.md.

[queues.proposals]       # knowledge and ideas for the product
write = ["role:*", "operator", "host"]
read = ["role:worker", "role:auditor", "operator"]
wake = ["role:worker"]
[queues.proposals.schema]
title = {type = "string", max = 240, required = true}
body = {type = "string", max = 65536, required = true}

[queues.questions]       # what only the operator can settle
write = ["role:*"]
read = ["operator", "role:*"]
[queues.questions.schema]
question = {type = "string", max = 8192, required = true}
default = {type = "string", max = 8192, required = true}
context = {type = "string", max = 16384}

[queues.answers]         # refs: the question
write = ["operator"]
read = ["role:*", "operator"]
wake = ["role:worker"]   # and any other role that asks
[queues.answers.schema]
body = {type = "string", max = 16384, required = true}

[queues.notices]         # operator and host facts for the roles
write = ["operator", "host"]
read = ["role:*", "operator"]
wake = ["role:worker"]
[queues.notices.schema]
body = {type = "string", max = 16384, required = true}

[queues.work]           # stage-3 work: items, revisions, waits, completions
write = ["role:*", "host", "operator"]
read = ["role:*", "operator", "host"]
wake = ["role:worker"]
[queues.work.schema]
kind = {type = "string", required = true, values = ["item", "transition", "wait", "completion"]}
item = {type = "string", max = 35}
rev = {type = "integer", min = 1}
title = {type = "string", max = 200}
body = {type = "string", max = 32768}
scope = {type = "string", max = 32768}
reason = {type = "string", max = 16384}
status = {type = "string", values = ["open", "doing", "blocked", "done", "dropped"]}
holder = {type = "principal"}
snapshot = {type = "digest"}
checks = {type = "list", item = {type = "string", max = 256}, max_items = 64}
