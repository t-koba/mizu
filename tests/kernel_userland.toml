# Test-only deployment config for the stage-2 example userland. It includes the
# shipped example kinds through the normal config include path and grants the
# kernel capabilities and subscriptions that the lifecycle test drives.
# config.example.toml grants neither capability to any shipped role. The test
# redirects data_dir into its temporary directory before initializing a project.
# Included kinds.question and kinds.insight declare fields.body max = 131072,
# matching the legacy insight preview bound; long legal bodies still project.
include = ["../examples/development/kinds.toml"]
data_dir = "state"
timezone = "UTC"

[engines.pi]
command = ["node"]

[limits]
daily_requests = 100
free_disk_mb = 0

[profiles.primary]
engine = "pi"
provider = "test-provider"
model = "test-model"
session = "persistent"

[roles.writer]
profile = "primary"
policy = ["../policies/shared.md"]
workspace = "read"
capabilities = ["files", "read", "objects", "events", "finish"]
subscribe = ["insight.*", "decision.*"]

[roles.reviewer]
profile = "primary"
policy = ["../policies/shared.md"]
workspace = "read"
capabilities = ["files", "read", "objects", "events", "finish"]
subscribe = ["insight.created", "insight.accept"]

[roles.observer]
profile = "primary"
policy = ["../policies/shared.md"]
workspace = "read"
capabilities = ["files", "read", "events", "finish"]
subscribe = ["insight.**", "decision.**"]

[roles.idle]
profile = "primary"
policy = ["../policies/shared.md"]
workspace = "read"
capabilities = ["files", "read", "finish"]
subscribe = ["insight.never"]
