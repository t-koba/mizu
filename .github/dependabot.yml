version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The product pins one Pi release across both adapters: every
  # @earendil-works package must move together, and dependabot's documented
  # cross-directory grouping is per dependency name, so a bot-managed bump
  # can only propose a branch that violates the product's own invariant.
  # The product's adoption path owns the pin; dependabot is told to leave
  # those packages alone rather than to spend a full matrix on a red branch.
  - package-ecosystem: npm
    directories:
      - /adapters/pi
      - /adapters/pi-durable
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@earendil-works/*"
