name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Linux runs the full suite on every supported Python; Linux/3.13 also
    # stages the installer, builds the sdist and runs rootless OCI. macOS and
    # Windows run the full suite on newest Python; oldest-version platform-only
    # behavior is covered by the focused compatibility job below.
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || (matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && 120 || 60) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
            shard: "0"
          - os: windows-latest
            python: "3.14"
            shard: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline core and transport contracts
        # Offline runners do not provision the operator-owned Pi SDKs, so the
        # SDK, durable, and reasoning-replay gates are explicitly waived here;
        # the authoritative network-enabled job below provisions both adapters.
        # Every cell publishes sanitized per-test timing evidence.
        run: python scripts/check.py ${{ matrix.shard && format('--test-shard {0} ', matrix.shard) || '' }}--report private-validation/offline.json --test-timings private-validation/test-timings.json --allow-not-run node-durable-contract-tests,node-pi-sdk-contract-tests,node-pi-reasoning-replay-tests --fail-fast
      - name: Core installer and CLI lifecycle
        if: runner.os == 'Linux' && matrix.python == '3.13'
        # Reuse the full source gate above via an explicit content-bound
        # receipt: the installer still verifies the staged manifest, and the
        # receipt must bind to this exact source/runtime/schema/waiver set.
        run: ./scripts/test-install.sh private-validation/offline.json
      - name: Rootless OCI persistent exec integration
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        # Trusted test host only: no runtime/socket is exposed to role sandboxes.
        # This bounded addition uses the existing cell's scope, not a new job.
        timeout-minutes: 10
        run: |
          timeout 60 sudo apt-get update
          timeout 90 sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          trap 'timeout 60 sh -c "podman ps -aq --filter label=io.mizu.project | xargs -r podman rm --force"' EXIT
          IMAGE=$(timeout 210 ./scripts/build-sandbox.sh --base docker.io/library/python:3.13-slim-bookworm)
          MIZU_OCI_IMAGE="$IMAGE" timeout 150 python -m unittest discover -s tests -p test_persistent_exec_oci.py -v
      - name: Source distribution build
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python scripts/package.py --output dist
      - name: Upload per-test timings
        # Evidence only: the versioned summary and hash-bound detail pages
        # hold sanitized test IDs plus durations/completion and minimal
        # runtime metadata; each JSON file is byte-bounded for VCS reads.
        # It never includes failure details or output tails;
        # do not upload offline.json, which can contain diagnostics. Always
        # runs (even on timeout) with missing-file tolerance so a killed
        # child still reports its partial entry.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-${{ matrix.os }}-${{ matrix.python }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: |
            private-validation/test-timings.json
            private-validation/test-timings.json.d/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload managed-import diagnostic
        # Only the bounded, schema-validated sidecar; never raw scratch/logs.
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-import-diagnostic-${{ matrix.os }}-${{ matrix.python }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: private-validation/project-import-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore
  platform-compatibility:
    # Only oldest-Python tests that touch OS-dependent runtime behavior; no
    # unrelated suite duplication. Windows preserves stable-ID parity shards.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
            shard: "0"
          - os: windows-latest
            python: "3.11"
            shard: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Oldest-version platform-specific tests
        # These tests exercise host locks, filesystem replacement and traversal,
        # plus process launch, at the oldest supported interpreter.
        run: >-
          python scripts/check_unittest.py platform-compatibility-failures.jsonl
          --test-timings platform-compatibility-timings.jsonl
          ${{ matrix.shard && format('--test-shard {0}', matrix.shard) || '' }}
          --test-id test_platform.PlatformContractTests.test_single_source_of_truth
          --test-id test_platform.PortablePrimitiveTests.test_lock_contention_portable
          --test-id test_platform.PortablePrimitiveTests.test_safe_read_refuses_symlink_portable
          --test-id test_platform.PortablePrimitiveTests.test_safe_read_managed_survives_portable_replacement
          --test-id test_platform.PortablePrimitiveTests.test_process_run_portable
          --test-id test_primitives.FileTests.test_atomic_replace_and_private_mode
          --test-id test_primitives.FileTests.test_exclusive_publication_is_safe_before_cleanup
          --test-id test_snapshot_concurrency.SnapshotConcurrencyTests.test_capture_skips_hardlinks_in_both_traversal_backends
      - name: Upload platform compatibility timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-compatibility-${{ matrix.os }}-${{ matrix.python }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: platform-compatibility-timings.jsonl
          retention-days: 7
          if-no-files-found: warn
  durable-contract:
    # Authoritative durable coverage: the pinned Pi SDK is provisioned here in
    # a network-enabled setup step, then the whole gate runs unwaived and
    # offline. Absent or mismatched dependencies fail this required job. The
    # waivers in the matrix jobs and the installer staging gate are scoped
    # fallbacks for environments that cannot provision; their receipts record
    # the waiver, and promotion still requires this job green.
    runs-on: ubuntu-24.04
    # The authoritative scope holds the modelled gate path (3246 s). Any
    # pinned-adapter install is charged to that path's 1200 s later-phase
    # budget, so two 300 s installs cannot extend the path; this job cannot
    # kill the gate before the
    # gate reaches its own bound.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Provision pinned Pi coding SDK
        # Network-enabled setup only; contract execution below is offline.
        # --engine-strict fails closed when the runner Node predates engines;
        # --ignore-scripts matches the installer's default-deny posture.
        run: npm ci --engine-strict --no-audit --no-fund --ignore-scripts
        working-directory: adapters/pi
      - name: Provision pinned Pi durable SDK
        run: npm ci --engine-strict --no-audit --no-fund --ignore-scripts
        working-directory: adapters/pi-durable
      - name: Unwaived offline and durable contracts
        # The authoritative job publishes the same bounded summary/detail evidence
        # as the matrix cells, so its suite cost is measured where the
        # promotion gate is decided.
        run: python scripts/check.py --report private-validation/durable.json --test-timings private-validation/test-timings.json --fail-fast
      - name: Upload per-test timings
        # Evidence only for the bound review: sanitized test IDs, durations
        # and minimal runtime metadata, never failure details or output
        # tails. Always runs (even on timeout) with missing-file tolerance.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-durable
          path: |
            private-validation/test-timings.json
            private-validation/test-timings.json.d/*.json
          retention-days: 7
          if-no-files-found: warn
  delegation-recovery-smoke:
    # Trusted disposable host fixture only, never a role/runtime grant or pilot.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Provision rootless OCI fixture tools
        timeout-minutes: 3
        run: timeout --kill-after=5 170 python tests/test_delegation_recovery_smoke.py --prepare
      - name: Synthetic supervisor death and independent recovery
        timeout-minutes: 3
        run: timeout --kill-after=5 170 python tests/test_delegation_recovery_smoke.py --live "$RUNNER_TEMP/mizu-recovery/state.json"
      - name: Independent cleanup from durable fixture identity
        if: always()
        timeout-minutes: 2
        # No broad container filters, global prune, host mounts, or raw logs.
        # Missing/uncertain evidence fails; it never releases a held reservation.
        run: timeout --kill-after=5 80 python tests/test_delegation_recovery_smoke.py --recover "$RUNNER_TEMP/mizu-recovery/state.json"
