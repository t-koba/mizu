name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Portable development plane: offline unit/contract checks on all three OSes.
    # Native service operation, live inference and OCI isolation are never asserted here.
    runs-on: ${{ matrix.os }}
    # Keep the original 40-minute Windows scope around its 1450-second child.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Offline core and transport contracts
        if: runner.os != 'Windows' || matrix.python != '3.13'
        # Offline runners do not provision the operator-owned Pi SDKs, so the
        # SDK, durable, and reasoning-replay gates are explicitly waived here;
        # the authoritative network-enabled job below provisions both adapters.
        run: python scripts/check.py --report private-validation/offline.json --allow-not-run node-durable-contract-tests,node-pi-sdk-contract-tests,node-pi-reasoning-replay-tests
      - name: Offline core and transport contracts with timings
        if: runner.os == 'Windows' && matrix.python == '3.13'
        # Collect per-test timing only on the target Windows timeout job.
        run: python scripts/check.py --report private-validation/offline.json --test-timings private-validation/windows-test-timings.json --allow-not-run node-durable-contract-tests,node-pi-sdk-contract-tests,node-pi-reasoning-replay-tests
      - name: Core installer and CLI lifecycle
        if: runner.os == 'Linux' && matrix.python == '3.13'
        # Reuse the full source gate above via an explicit content-bound
        # receipt: the installer still verifies the staged manifest, and the
        # receipt must bind to this exact source/runtime/schema/waiver set.
        run: ./scripts/test-install.sh private-validation/offline.json
      - name: Source distribution build
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python scripts/package.py --output dist
      - name: Upload Windows per-test timings
        # Evidence only for the timeout review: the dedicated timings file
        # holds sanitized test IDs plus durations/completion and minimal
        # runtime metadata. It never includes failure details or output tails;
        # do not upload offline.json, which can contain diagnostics. Always
        # runs (even on timeout) with missing-file tolerance so a killed
        # child still reports its partial entry.
        if: always() && runner.os == 'Windows' && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-timings
          path: private-validation/windows-test-timings.json
          retention-days: 7
          if-no-files-found: warn
  durable-contract:
    # Authoritative durable coverage: the pinned Pi SDK is provisioned here in
    # a network-enabled setup step, then the whole gate runs unwaived and
    # offline. Absent or mismatched dependencies fail this required job. The
    # waivers in the matrix jobs and the installer staging gate are scoped
    # fallbacks for environments that cannot provision; their receipts record
    # the waiver, and promotion still requires this job green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Provision pinned Pi coding SDK
        # Network-enabled setup only; contract execution below is offline.
        # --engine-strict fails closed when the runner Node predates engines;
        # --ignore-scripts matches the installer's default-deny posture.
        run: npm ci --engine-strict --no-audit --no-fund --ignore-scripts
        working-directory: adapters/pi
      - name: Provision pinned Pi durable SDK
        run: npm ci --engine-strict --no-audit --no-fund --ignore-scripts
        working-directory: adapters/pi-durable
      - name: Unwaived offline and durable contracts
        run: python scripts/check.py --report private-validation/durable.json
