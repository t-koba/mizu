# Mizu current configuration. Edit the private copy created by `mizu configure`.
# Shared fragments (M3): merge reviewed TOML before validation, e.g.
# include = ["shared/base.toml"]. Entries are literal relative paths against
# this file's directory (no ~, ${VAR}, absolute paths, or symlinks); tables
# deep-merge and any duplicate leaf key is an error naming both files.
# Relative values inside fragments resolve against this directory.
# include = []
data_dir = "~/.local/state/mizu"
timezone = "UTC"
# Default answering role for consultation when the caller names none.
# Unset (empty) fails closed: consultation then requires an explicit role.
consult_role = "consult"
# Default role for one-shot implementation delegation when the caller names none.
# Unset (empty) fails closed: delegation then requires an explicit role.
# delegate_role = ""
exclude = [".git", ".pi", ".env", ".env.*", ".venv", "node_modules", "__pycache__", "*.pyc", "*.pyo", ".pytest_cache"]

# Read-only report detail/sample budgets; defaults shown, not hard maxima.
# Strict integers up to the TOML/Python collection-index range (not resource budgets).
# runs_scanned and finish_rate_runs_scanned leave one index for a truncation candidate.
# runs_scanned limits detail reads, not enumeration of all run directories/mtimes.
# finish_rate_runs_scanned limits the 24-hour status-rate scan; fixed 64 KiB/file
# and 8 MiB total read safety caps remain in force.
# These settings do not impose a whole-report byte cap.
# [usage]
# runs_scanned = 5000        # Minimum 1; newest-first physical-run detail window.
# finish_rate_runs_scanned = 512 # Minimum 1; run-entry window for finish-only status rate.
# recent_entries = 200      # Minimum 1; retained summary entries.
# cache_affinity_runs = 200 # Minimum 0; also limited by runs_scanned; zero disables scan.
# cache_affinity_rows = 200 # Minimum 0; retained rows; total within dispatch record caps.
# unknown_keys = 20         # Minimum 0; zero hides key samples, not unknown-shape counts.

# Per-run dispatch record retention/samples, shared with both read-only consumers.
# Counts <= min(9223372036854775807, sys.maxsize); bytes <=
# min(9223372036854775807, sys.maxsize - 1), representation bounds, not budgets.
# [dispatch_evidence]
# max_attempts = 64    # Minimum 1; retain newest attempts.
# max_bytes = 262144   # Minimum 66; includes JSON envelope/newline; may retain no attempts.
# max_models = 16      # Minimum 0; omitted pairs mark models_truncated.
# unknown_keys = 20    # Minimum 0; independent of [usage].unknown_keys.
# Text labels keep a fixed 256-character safety ceiling, not a configuration knob.

# Local CI-request evidence read budgets, shared by ci_requests and ci_costs.
# Strict integers 1..min(9223372036854775807, sys.maxsize); defaults shown.
# os.listdir still materializes/sorts all names: not a directory-memory bound.
# [ci_requests]
# name_processing_limit = 10000  # Names processed after listing, including non-records.
# record_limit = 1000            # Unique candidates validated; internal offsets < this.
# Fixed record safety cap (8 KiB) and page/tool schema caps are independent.

# Host-only usage --cache-evidence diagnostic budgets, independent of [usage].
# Strict positive integers; counts <= min(9223372036854775807, sys.maxsize),
# seconds <= 9223372036854775807 (representation bounds, not resource budgets).
# [scheduler_evidence]
# candidate_entries = 5000  # Enumeration includes non-directories.
# files = 200               # Newest run directories within those candidates.
# scan_seconds = 2          # Cooperative deadline; cannot preempt stalled OS calls.

# Local publication-receipt read budgets shared by listing and strict wait
# resolution. Strict integers 1..min(9223372036854775807, sys.maxsize); the
# directory listing is still materialized and sorted before the prefix is used.
# [publication_evidence]
# name_processing_limit = 10000
# record_limit = 1000

# Local `git rev-parse --verify HEAD^{commit}` timeout for publication source
# evidence. Integer seconds 1..9223372036854775807 (TOML representation ceiling,
# not a runtime-performance guarantee); defaults shown.
# [publication]
# source_commit_timeout_seconds = 5

# Local `mizu init` git-tree import command bounds. Integer seconds
# 1..9223372036854775807 (TOML representation ceiling); defaults shown. A
# stopped command reports its reason and bound; a real non-zero exit keeps
# git's bounded diagnostic.
# [project_import]
# status_timeout_seconds = 30
# clone_timeout_seconds = 300
# local_timeout_seconds = 15

# Named dynamic-model selectors (see docs/model-selection.md). Empty by default;
# a role's selector key replaces its profile with one of these tables.
# [selectors]

# Optional regenerable workspace caches only. Empty roots disable cleanup.
# Relative literal directory roots must be untracked and snapshot-excluded;
# private/host state, links, and overlapping roots are refused.
[workspace_cache]
roots = []
max_bytes = 1073741824          # 1–9223372036854775807 logical bytes; at/above clears all roots.
check_interval_seconds = 3600  # 1–2678400; due checks at execution boundaries, no timer.
# Following budgets are trusted operator choices, not total lock-hold bounds.
# Except max_depth, their range is 1–9223372036854775807 (TOML representation).
max_entries = 100000           # Scandir entries across roots; root directories excluded.
max_depth = 64                 # 1–64 per root, root depth 0; conservative safety ceiling.
# Depth stays capped pending a separate shutil.rmtree deletion-consumer audit;
# this is not a native-platform validated recursion limit.
scan_seconds = 10             # Starts after index lookup/normalization, not before Git.
# Cooperative checks around filesystem operations cannot interrupt blocking I/O.
# Deletion is outside the scan clock; locks remain held through deletion.
git_timeout_seconds = 10      # Two independently timed commands: rev-parse, then ls-files.
git_output_bytes = 8388608    # Captured index stdout+stderr; rev-parse keeps a 4096-byte cap.
# Decoded/split/normalized path structures use memory beyond git_output_bytes.

# Decision-to-work policy: the mechanism defaults to create for every source.
# These example source defaults avoid tasks for operator/VCS dispositions;
# each accept/modify may override them with work_item_intent = "create".
[insight_decisions]
work_item_intent_default = "create"
[insight_decisions.work_item_intent_by_source]
operator = "none"
vcs = "none"

# Operator-only records; no model writer. Pending addressed records admit runs.
# Disable a kind to stop writes/delivery, without deleting its immutable audit.
# Answers bind an exact insight ID/revision and derive its authenticated source.
# Optional declared publisher outcomes default closed (record_kinds absent).
# Schema and host adapter route: docs/shared-records.md#declared-host-publisher-outcomes
[operator_records.answer]
enabled = true
wake = true
route = "question_source"
retention = "permanent"  # Only permanent immutable storage is supported; no TTL/deletion.
[operator_records."operator.notice"]
enabled = true
wake = true
route = "addressee"
retention = "permanent"

# Role writes and author-only reads default closed: no role-writable kind, record_write or record_read grant is enabled.
# To opt in, add "record_write" (to write) and "record_read" (to read that role's own records)
# to the intended role's capabilities AND declare (uncomment to enable):
# Role-writable kind names cannot contain '/'; record IDs may use slash-separated segments.
#   [record_kinds."role.note"]
#   writer = "role.worker"       # Authenticated role principal, not tool input.
#   route = "none"               # Data only; no delivery, source migration or wake.
#   wake = false
#   retention = "permanent"
#   acknowledgement = "explicit"
#   subject = "object"           # Subject and payload are bounded finite JSON objects.
#   maximum = 8192               # Canonical envelope bytes, 1-131072.
# See docs/shared-records.md#role-authenticated-data-writes-and-author-only-retrieval for the tool schemas.

[limits]
# Provisional project cap on open/doing/blocked work; 0 disables.
# Existing over-limit items are preserved; only new seeds are refused.
open_work_items = 100
# Provisional per-source cap on unresolved live producer inputs; 0 disables.
# Existing over-limit inputs are preserved; only the next admission is held.
producer_inputs_per_source = 20
daily_requests = 0                 # Fail closed. Set a deliberate positive limit.
shared_daily_requests = 0          # Optional shared total across projects sharing data_dir (0 disables, max 100,000).
budget_day_file_bytes = 4194304     # Day-file write/peek budget (4 MiB default); positive, up to min(TOML signed-64-bit max, sys.maxsize). Larger values allow proportionally larger resource use.
requests_per_run = 24
tools_per_run = 64
wrap_up_requests = 3          # Total wrap-up requests after a per-run bound is hit (1-1073741824); roles may override per role.
wrap_up_tools = 5             # Total wrap-up tool calls after a per-run bound is hit (1-1073741824); roles may override per role.
delegate_wrap_up_requests = 2 # Aggregate child share of the per-run wrap-up allowance (0-2).
delegate_wrap_up_tools = 4    # Aggregate child share of wrap-up tools (0-4); caller retains at least one.
run_seconds = 1200
model_request_seconds = 1200     # Positive logical-request/query/turn deadline.
command_seconds = 300
idle_seconds = 15
cooldown_seconds = 5
progress_signals = ["tool", "code", "decision", "insight", "input"] # Signals qualify immediate progress; writer handoff also needs a new Next. Empty disables qualification.
no_progress_continuations = 0 # Immediate no-progress self-admissions (0-100); writers require role-eligible ready work.
no_progress_recovery_after = 2 # Consecutive empty continue/bounded units before next persistent-session dispatch starts fresh (1-100).
no_progress_backoff_seconds = 0 # Read-only on-change timer default; per-role override also applies to writers.
writer_no_progress_backoff_seconds = 300 # Writer fallback after no-progress continue/bounded, only with ready work (0 disables, max 86400).
default_wait_seconds = 1800
maximum_wait_seconds = 86400
max_failures = 3
parallel_runs = 4              # Active execution slot cap, independent of pending tickets.
admission_queue_capacity = 16 # Pending FIFO ticket cap (1-1073741824), independent of parallel_runs.
parallel_consults = 2
parallel_checks = 2            # Shared compute slots for asynchronous sandbox checks, independent of model admission (1-64).
check_pending = 32             # Unfinished check jobs retained per project (1-1024); a submission beyond it is refused.
check_retained = 1024          # Total retained check records including subscriptions (1-1024); safe acknowledged-only eviction.
history_temporaries = 64       # Decision-history crash-leftover recovery budget (1-4096); excess fails closed without cleanup.
decision_projection_records = 512 # Combined page retention rows (1-512); explicit projection overflow refuses.
decision_receipt_diagnostics = 10 # Malformed-receipt diagnostics per decision page (0-100); 0 hides the sample, not decisions.
queue_observations = 8          # Contended-admission observations in started.json (0-100); also trimmed to the 64 KiB read cap, tracking omitted.
decision_reconciliation_bytes = 8388608 # Host-only activation plan/report bytes (1-67108864); runtime checks the report digest, not its body.
admission_wait_seconds = 300  # Bound on the wait for execution capacity, counted from the start of the wait; 0 keeps the FIFO ticket until dispatch or cancellation. This replaced busy_retry_seconds for this wait, whose 0 used to mean fail fast, so a carried-over 0 now waits without bound.
busy_retry_seconds = 300      # Separate timed provider-selection recovery window; 0 disables recovery waiting.
drain_yield = true             # Persistent, non-ephemeral units wrap up at a safe request boundary on explicit drain.
safe_point_yield_quantum = 0   # Completed Claude queries/Codex turns between optional handoff opportunities; 0 disables preemption.
missing_finish_followups = 1   # Extra bounded turns after a normal terminal return without mizu_finish (0-3).
missing_finish_counts_as_failure = true # Exhaustion increments the failure brake by default.
# Opt-in run-local record-lock diagnostics on Engine/CLI stderr (journal for
# scheduled units); no collection or extra output when disabled.
lock_diagnostics = false
missing_finish_recovery_after = 2 # Consecutive missing-finish failures before a persistent session is rotated (1-100; default 2, below max_failures).
role_state_bytes = 4096        # Maximum canonical JSON bytes for a new replacement record (1024-65536; default 4096).
# Existing records remain readable up to the supported 65536-byte ceiling.
role_state_prompt_bytes = 4096 # Maximum bytes of a role's own research state injected into its prompt (1-65536; default 4096).
output_bytes = 262144
file_bytes = 8388608
snapshot_bytes = 268435456
snapshot_files = 20000
history_index = 128              # Published IDs in the active history window; merge ancestry uses the same bound.
prompt_snapshots = 6             # Recent anchored summaries offered to each work unit.
retention_days = 31              # Operator-selected retention window (days) for budget day-files and decided proposals. 0 disables time-based reaping; this clock never expires runs, snapshots or permanent audit records.
run_retention_days = 31        # Expire only complete, unreferenced run components (0 keeps indefinitely; 0–3650).
run_retention_scan_runs = 5000  # Physical runs per retention scan (1–100000); independent of usage reports; incomplete scans refuse all deletion.
snapshot_retention_days = 31   # Unreferenced snapshots and superseded histories (0 disables automatic GC; 0–3650).
automatic_prune_interval_seconds = 86400 # Opt-out cadence for automatic run/snapshot retention at safe boundaries (0 disables both; manual commands stay; 0–2678400).
automatic_smoke_retention_interval_seconds = 86400 # Opt-out cadence applying the shared smoke retention at safe execution boundaries (0 disables automatic sweeps, manual `mizu smoke-retention` stays; 0–2678400).
smoke_retention_projects = 5000        # Shared scan budget on project roots (1–9223372036854775807; default 5000).
smoke_retention_pairs = 5000           # Shared scan budget on published/pending pairs and quarantine entries, each (default 5000).
smoke_retention_refs = 20000           # Shared scan budget on live reference occurrences (default 20000).
smoke_retention_entries = 100000       # Shared scan budget on metadata entries plus record reads, including empty directories (default 100000).
smoke_retention_metadata_bytes = 67108864 # Cumulative reference, manifest, policy and audit metadata read budget (default 64 MiB).
smoke_retention_report_bytes = 83886080000 # Cumulative report payload read budget; defaults to the former 5,000 pairs x 16 MiB bound (80,000 MiB).
event_log_compress_days = 7    # Compress bulky per-run engine logs (*-events.jsonl, diagnostics.txt) older than N days to .gz (0 disables).
event_log_retention_days = 31   # Drop bulky per-run engine logs (raw and .gz) older than M days (0 disables); Lifecycle records follow run_retention_days, not this log clock.
event_stream_bytes = 4194304  # Per-run engine event-stream retention in bytes (1 MiB-256 MiB); past-budget bytes are dropped with an explicit *-events-truncated.json marker while the run continues.
insight_cursor_ttl_seconds = 86400 # Absolute insight page cursor lifetime (60-604800 seconds); continuation never extends it.
pending_insights = 30            # Newest pending proposals offered per prompt. Raw inbox/decisions stay on disk; `mizu insight list` uses 1000.
work_items_doing = 1             # Per-role active doing slots (1-100); blocked waits excluded.
work_items_stale_seconds = 86400 # Doing-age review visibility only (1-31536000); never expires a hold.
work_items_blocked_max_age_seconds = 604800 # Non-deadline blocked waits expire for review after seven days (positive TOML integer).
work_items_prompt = 20           # Open work-item rows per full/delta prompt (1-100; overflow and incomplete legacy coverage are explicit).
decision_events_limit = 10  # Decision events per dispatch per role (1-100; default 10). Bound stays 100; value is policy.
work_item_events_limit = 10 # Terminal work-item events per dispatch per role (1-100; default 10). Independent of the decision batch above.
session_max_tokens = 0          # Restart a resumed persistent session once cumulative tokens reach N (0 disables).
session_max_cost_usd = 0         # Restart a resumed persistent session once estimated cost (USD) reaches N (0 disables).
session_max_age_seconds = 0      # Restart a resumed persistent session once wall-clock conversation lifetime reaches N seconds (stable creation surviving same-id saves; 0 disables).
free_disk_mb = 1024

[sandbox]
executable = "podman"             # Trusted container runtime: podman or docker (Podman/Desktop on macOS/Windows).
image = ""                        # Local sha256:<64 hex> from build-sandbox.sh, or registry@sha256:...
network = "none"                  # Policy-selected container network. `none` preserves isolation; any other value is passed to the runtime explicitly and accepts exfiltration risk. Secrets are never mounted either way.
memory_mb = 2048
cpus = 2
pids = 256
check_cache_paths = []         # Excluded top-level artifact dirs preserved between checks; queued custom experiments may opt in per call; the live writer tree is never touched.
check_reuse = false            # Share matching check executions and evidence across roles (docs/check-jobs.md).
check_input_files = 250000    # Bound on the dependency inputs one check may compare for reuse (1-1099511627776).
check_input_bytes = 8589934592 # Bound on the bytes of those inputs (1-1099511627776).
temporary_mb = 256
file_mb = 128                     # Per-file limit, NOT a whole-workspace disk quota.
selinux_label = true              # Linux-only :z relabeling of dedicated mounts.
entrypoint = "/bin/sh"            # Policy-selected container entrypoint; the image must provide it.
entrypoint_args = []              # Ordered runner argv after the image, before `-c` script (one argv item each, never shell-split). Empty keeps the existing command; e.g. entrypoint_args = ["-o", "pipefail"] with entrypoint = "/bin/bash".
# Extra read-only host mounts, selected by policy. Model code can read but
# never write through these. Never mount sockets, credentials, or secret
# material; system and harness paths are refused.
# [[sandbox.mounts]]
# source = "/data/corpus"
# target = "/data"
# Extra container environment, selected by policy. Runtime vars (HOME, TMPDIR,
# PYTHONDONTWRITEBYTECODE, PYTHONPYCACHEPREFIX,
# PATH), process-startup hijack vars (NODE_OPTIONS, LD_PRELOAD, LD_LIBRARY_PATH,
# PYTHONPATH, BASH_ENV) and secret-looking names (KEY/SECRET/TOKEN as a full
# _-separated token, e.g. HF_TOKEN; MONKEY_PATH and TOKENIZERS_* stay allowed)
# are refused; values are recorded by key only.
# [sandbox.env]
# HF_HOME = "/data/hf"
mode = "rootless"                 # rootless on every OS, or single on Linux hosts without subordinate-ID delegation.
# Single mode only (Linux): operator-owned namespace wrapper argv (absolute paths),
# explicit podman storage paths, and a delegated cgroup parent whose final
# component must not end in .slice. cgroup_manager must be cgroupfs there.
# namespace_helper = ["~/.local/share/mizu/current/scripts/idmap/mizu-userns"]
# podman_root = "~/.local/share/mizu/containers/storage"
# podman_runroot = "/run/user/1000/containers"
# podman_tmpdir = "/run/user/1000/containers/tmp"
# storage_driver = "overlay"
# storage_options = ["overlay.ignore_chown_errors=true"]
# cgroup_manager = "cgroupfs"
# cgroup_parent = "user.slice/user-1000.slice/user@1000.service/mizucg"

# Systemd-only deployment and validation policy; positive integer seconds.
# Restart/stop defaults preserve existing generated units; regenerate and
# reinstall units after changing them. The verification timeout bounds the
# optional systemd-analyze verify command during install. Other platforms
# ignore this section.
# [services]
# systemd_restart_delay_seconds = 15
# systemd_stop_timeout_seconds = 45
# systemd_verify_timeout_seconds = 60

# Host-command wall bounds for `mizu doctor` probes. Integer seconds 1-86400;
# defaults shown. A probe that does not answer within its bound reports the
# timeout and bound, never a missing capability.
# [doctor]
# runtime_version_seconds = 20
# namespace_helper_seconds = 10
# image_inspect_seconds = 15
# node_capability_seconds = 10
# sandbox_smoke_seconds = 30

[engines.pi]
command = ["node"]
directory = "pi"

[engines.pi-durable]
command = ["node"]
directory = "pi-durable"

[engines.codex]
command = ["codex"]
directory = "codex"

[engines.claude]
# Python interpreter from the separately installed Claude adapter environment.
command = ["python3"]
directory = "claude"

[profiles.primary]
engine = "pi"
provider = ""
model = ""
session = "persistent"
[profiles.primary.options]
thinkingLevel = "off"
# cacheRetention = "long"  # Provider prompt-cache retention: none|short|long; unset keeps the Pi default (short). long via the Pi env channel; none degrades to Pi default on pi.

[profiles.alternate]
engine = "pi"
provider = ""
model = ""
session = "ephemeral"
[profiles.alternate.options]
thinkingLevel = "off"
# cacheRetention = "long"  # Provider prompt-cache retention: none|short|long; unset keeps the Pi default (short). long via the Pi env channel; none degrades to Pi default on pi.

# Durable execution: selectable via engine = "pi-durable" (no live switch here).
# pi-durable reads Pi's login store (auth.json) from its own engine directory plus
# environment. To reuse a Pi subscription login, point [engines.pi-durable] directory
# at the same path as [engines.pi] or copy auth.json over.
# [profiles.durable]
# engine = "pi-durable"
# provider = ""
# model = ""
# session = "persistent"
# [profiles.durable.options]
# thinkingLevel = "off"
# cacheRetention = "long"  # Provider prompt-cache retention: none|short|long; unset keeps the engine default; retuning keeps the store.
# durable_backend = "sqlite"       # Only backend; unknown values are refused.
# durable_resume = "compatible"    # compatible binds resume to current grants; fresh refuses resume.
# durable_retention_days = 31      # Terminal-store retention applied per execute with accounting; omit to disable.
# durable_compaction_reserve_tokens = 16384      # Live-context bound: Harness compacts above contextWindow minus this (0-1073741824; omit to keep the engine default).
# durable_compaction_keep_recent_tokens = 20000  # Verbatim recent context a summary keeps (0-1073741824; omit to keep the engine default).
# durable_compaction_background_tokens = 32768   # Early background compaction starts this far below the blocking threshold; 0 disables background (0-1073741824; omit to keep the engine default).

# Native options belong to the selected engine; Mizu has no effort enum.
# [profiles.codex]
# engine = "codex"
# provider = "CUSTOM_PROVIDER_ID"
# model = "EXACT_MODEL_ID"
# session = "persistent"
# [profiles.codex.options]
# model_reasoning_effort = "high"
# web_search = "live"
# [profiles.claude]
# engine = "claude"
# provider = "anthropic"
# model = "EXACT_MODEL_ID"
# session = "persistent"
# [profiles.claude.options]
# effort = "high"
# max_turns = 12
# max_budget_usd = 1.0

[vcs]
command = []                 # Trusted argv executable for upstream sync; JSON stdin/stdout, never a shell string. Empty disables.
timeout_seconds = 20         # Per-invocation deadline for the adapter.
max_bytes = 524288           # Maximum adapter request/response payload (512 KiB).
artifact_full_read_chars = 524288 # Whole-file artifact character cap (positive signed-64-bit integer); not a paged-file cap.
# artifact_page_bytes = 65536 # Omit to derive min(524288, max(1, max_bytes // 8)); explicit 1..max(1, max_bytes // 8).
diagnostic_bytes = 2048      # Model-visible stderr tail on a nonzero exit; 0 disables, maximum 8192.
ci_branch = ""               # Authoritative CI/reporting branch exposed as ci_branch to vcs_read roles (e.g. "mizu"); empty disables exposure.
ci_wake_extra_branches = [] # Add up to 64 valid branches to CI wake selection; combined with ci_branch (empty default preserves prior behavior).
ci_rewake_seconds = 1800     # Unchanged-red re-wake interval in seconds (60-86400); an unchanged red still re-wakes eventually.
retire_grant = false         # Explicit operator grant for vcs_retire; false disables retirement.
close_grant = false          # Explicit operator grant for routine vcs_dispose close; false disables close.
merge_grant = false          # Explicit operator grant for vcs_dispose merge; false disables merge (merges also need a GO approval).
owned_prefixes = []          # Temporary integration namespaces (e.g. ["mizu/"]); only these retire.
protected_refs = []          # Exact long-lived refs that always win (e.g. ["main"]); never retire.
poll_enabled = false         # Explicit opt-in for daemon upstream/CI polling; false disables.
poll_proposals_enabled = false # Additional opt-in for proposal observations; also requires poll_enabled.
poll_interval_seconds = 300  # Daemon poll cadence in seconds (15-86400).
poll_max_branches = 4            # CI branches polled per daemon tick (1-64).
poll_fetch_timeout_seconds = 30  # Daemon fetch adapter cap in seconds (1-300).
poll_status_timeout_seconds = 15 # Daemon per-branch status adapter cap in seconds (1-300).
[web]
hosts = []                       # HTTPS host allowlist, rechecked on every redirect: exact hosts ("example.com");
# a leading-dot entry (".python.org") also covers the base domain and its subdomains. A single "*" entry
# allows any public HTTPS host (HTTPS-only, port 443, public-DNS refusal unless intranet, and bounds still
# apply). Empty stays closed. Prefer the narrowest entry.
probe_hosts = []                 # HTTPS host allowlist for policy-bounded protocol observation (empty disables probe),
# with the same exact/leading-dot/"*" entries (probe keeps its own method/header/body rules).
probe_methods = []               # Allowlisted probe methods, e.g. ["GET", "POST"] (empty disables probe).
feeds = []                       # RSS/Atom; optional discovery adapter below.
search_feed_item_limit = 200     # Per-feed RSS/Atom candidates retained (1-1000).
search_command = []              # Trusted argv; JSON stdin includes query and whole-invocation budget_seconds, never a shell string.
destination_command = []       # Trusted argv owning the destination decision per request (URL, role, capability fetch/probe, redirect hop); stdin bounded JSON, stdout {"allow": bool}. Unset keeps the host lists; set means the decider decides authoritatively per hop and fail-closed (unset/failing/timeout/malformed denies), and fetch bypasses the response cache so every hop is decided live. Transport protections stay in mechanism.
intranet = false                 # Policy-selected private-network retrieval. true allows RFC 1918/ULA destinations (loopback stays refused); the operator accepts the exfiltration risk.
cache_seconds = 1800
timeout_seconds = 20
max_bytes = 524288
diagnostic_bytes = 2048     # Failed configured-program stderr tail; 0 disables, maximum 8192.

[materialize]
command = []                 # Trusted argv executable for offline-input materialization; JSON stdin/stdout, never a shell string. Empty disables.
timeout_seconds = 20         # Per-invocation deadline for the adapter.
max_bytes = 524288           # Maximum adapter request/response payload (512 KiB).
diagnostic_bytes = 2048      # Failed adapter stderr tail sent to the model; 0 disables, maximum 8192.

[roles.worker]
# work_items_doing = 2          # Optional override of [limits].work_items_doing (1-100).
profile = "primary"
# Composed policy: string or list in order, e.g. ["policies/shared.md", "policies/worker.md"].
# At most 16 files, each at most 64 KiB, 256 KiB total; missing/oversize fails.
policy = ["policies/shared.md", "policies/worker.md"]
workspace = "write"
# Optional per-role sequential shell for direct exec only; requires the existing "exec" grant. Default false.
# persistent_exec = true
# Grant "check_job" to run acceptance checks asynchronously, so a long check does not block the unit (docs/check-jobs.md).
capabilities = ["files", "read", "diff", "exec", "experiment", "verify", "fetch", "search", "insights", "decide", "consult", "work_items_read", "work_items_create", "work_items_transition", "work_items_legacy_read", "work_items_reconcile", "work_order", "finish"]
daemon = true
# Per-role per-run spend override (optional, same range as [limits]; unset keeps the project value).
# requests_per_run = 24
# tools_per_run = 64
# wrap_up_requests = 3
# wrap_up_tools = 5
# Per-role event batch overrides (optional, 1-100 each; unset keeps the matching project default).
# decision_events_limit = 10
# Shared decision delivery requires an explicit page-byte budget per subscriber.
# Unset by default; setting a budget does NOT activate shared delivery.
# decision_page_bytes = 65536  # 1-1048576; include references/metadata, reserve other prompt space.
# work_item_events_limit = 10
# Per-role no-progress timer-wake override (optional, 0-86400; unset keeps the project value).
# no_progress_backoff_seconds = 0 # Override this role's no-progress timer; unset writer roles use the project writer default.
# Per-role writer-daemon cooldown override (optional, 1-1073741824; unset keeps
# [limits].cooldown_seconds; applies to writable daemon spacing and deferred
# re-evaluation, read-only cadence stays on idle_seconds).
# cooldown_seconds = 5
# Explicit daemon scheduling policy (optional, signals|periodic; unset keeps the
# workspace default: write uses signals, read/none use periodic). signals
# consults the role-aware should_run gate, periodic runs at the ordinary cadence
# while armed and neither paused nor draining. The daemon loop consumes this
# policy, never workspace.
# daemon_policy = "signals"
# Optional ordinary daemon spacing in seconds (optional, 1-1073741824; unset keeps
# the policy default: signals uses the effective cooldown_seconds, periodic uses
# [limits].idle_seconds). Affects ordinary daemon spacing only, never deferred
# next-evaluation re-entry or the cooldown_seconds retry policy.
# daemon_spacing_seconds = 5
# Per-role progress-signal override (optional, same unique supported names
# as [limits].progress_signals; unset inherits the project list, explicit []
# disables qualification for this role).
# progress_signals = ["tool", "code", "decision", "insight", "input"]
# Per-role event-only recovery poll override (optional, 60-2678400 seconds,
# default 60; the Task Scheduler minimum/bounds). Applies to unscheduled watched
# roles on all platforms: Linux/macOS recheck pending event inputs alongside
# file triggers, Windows polls at this cadence; scheduled timers are unchanged.
# event_poll_seconds = 60

[roles.searcher]
profile = "alternate"
# Opt in to an open-work producer hold (default false; per-source holds remain independent).
# held_at_capacity = true
policy = ["policies/shared.md", "policies/searcher.md"]
workspace = "read"
# Add "withdraw_decided" here only to allow retracting proposals with a current accept/modify disposition.
capabilities = ["files", "read", "search", "fetch", "experiment", "submit_insight", "revise_insight", "withdraw_insight", "work_items_read", "finish"]
interval_seconds = 1800

[roles.reviewer]
profile = "alternate"
policy = ["policies/shared.md", "policies/reviewer.md"]
workspace = "read"
capabilities = ["files", "read", "diff", "exec", "experiment", "submit_insight", "revise_insight", "withdraw_insight", "work_items_read", "finish"]
# on_change only skips unchanged snapshots; it combines with interval_seconds.
on_change = true
interval_seconds = 900
# A rejected finding returns for reconsideration even when the code is unchanged.
# decision_events = ["reject"]
# Terminal work from this role's findings can also return for follow-up (default []).
# work_item_events = ["done", "dropped"]
# Routes are independent when work_item_sources is explicit; each any requires
# its own nonempty subscription. Both default to own.
# decision_sources = "any"  # decisions from any source; requires decision_events.
# work_item_sources = "own" # terminal events by origin submitter, never actor.
# Dispatch batches are independent per source: decision_events_limit bounds only
# decisions, work_item_events_limit only terminal events (role override or project default).
# Migration: omitted work_item_sources inherits legacy decision_sources for terminal
# delivery; terminal-only legacy decision_sources="any" resolves to decision own, work-item any.
# A red ci_branch wakes only roles with ci_wake (default true for write roles,
# false otherwise), so event-only roles skip CI they never subscribed to.
# ci_wake = false

[roles.reporter]
# Optional event batching (60-2678400 seconds; unset keeps current triggers).
# Non-daemon watched roles only: replace file notifications/recovery polls with
# one periodic `run --event` trigger, including for scheduled roles. Ordinary
# schedules remain unchanged and may deliver inputs earlier. Independent of
# event_poll_seconds, which only controls unset-batch unscheduled recovery.
# event_batch_seconds = 300
profile = "primary"
policy = ["policies/shared.md", "policies/reporter.md"]
workspace = "read"
capabilities = ["files", "read", "diff", "insights", "report", "work_items_read", "finish"]
calendar = ["07:00", "19:00"]

[roles.consult]
profile = "alternate"
policy = ["policies/shared.md", "policies/consult.md"]
workspace = "read"
capabilities = ["files", "read", "work_items_read", "finish"]

# Enable these two on a separate candidate project, not on the deployed release.
[roles.maintainer]
profile = "primary"
policy = ["policies/shared.md", "policies/maintainer.md"]
workspace = "write"
capabilities = ["files", "read", "diff", "exec", "experiment", "verify", "insights", "decide", "consult", "work_items_read", "finish"]
interval_seconds = 21600

[roles.maintainer-searcher]
profile = "alternate"
policy = ["policies/shared.md", "policies/maintainer-searcher.md"]
workspace = "read"
capabilities = ["files", "read", "search", "fetch", "experiment", "submit_insight", "revise_insight", "withdraw_insight", "work_items_read", "finish"]
interval_seconds = 21600

# Dedicated publisher for external publication only. Uncomment to enable on a
# project with `[vcs] command` configured; run explicitly via
# `mizu run <project> --role publisher` after the operator records
# `GO <branch>` approval for the current code digest (see docs/configuration.md).
# This role never holds `decide`, so it cannot approve its own push (config
# load refuses that combination); it may hold `submit_insight` for ordinary
# reports, which can never mint an operator-channel GO approval. `workspace = "write"` below is
# required plumbing: config load refuses `verify`/`sync`/`vcs_publish` without
# it. It is not an edit grant: the capability list holds no source-editing
# tool (no `exec`, no edit engine tools), so merging stays ordinary workspace
# work by other roles followed by verification.
# [roles.publisher]
# profile = "primary"
# policy = ["policies/shared.md", "policies/publisher.md"]
# workspace = "write"
# capabilities = ["files", "read", "diff", "verify", "sync", "vcs_read", "vcs_publish", "insights", "finish"]

# Dedicated integrator for external PR/ref operations only. Uncomment to enable
# on a project with `[vcs]` command and grants configured; run explicitly via
# `mizu run <project> --role integrator` after the operator records
# `GO <branch>` approval for the current code digest (see docs/configuration.md).
# This role never holds `decide`, so it cannot approve its own disposition
# (config load refuses that combination); it may hold `submit_insight` for
# ordinary integration reports, which can never mint an operator-channel
# GO approval. `workspace = "read"` is
# enough: integration authority is the capability plus the configured grants,
# not source-write access. It holds no source-editing tool (no `exec`, no edit
# engine tools) and no `verify`, so it cannot edit or complete source work.
# [roles.integrator]
# profile = "alternate"
# policy = "policies/integrator.md"
# workspace = "read"
# capabilities = ["files", "read", "vcs_read", "vcs_dispose", "vcs_retire", "insights", "finish"]

# Optional role that asks the provider for CI at an exact published commit. It
# also needs `[vcs] request_grant = true`; without that grant the capability
# stays unusable even when the role holds it. The target is always a
# completed publication receipt, never a branch head.
# [roles.evidence]
# profile = "alternate"
# policy = "policies/evidence.md"
# workspace = "read"
# capabilities = ["files", "read", "vcs_read", "vcs_request", "finish"]

# Optional dynamic selection. Replace a role's profile with selector = "adaptive".
# Existing profiles above remain unchanged; set exact provider/model IDs yourself.
# See docs/model-selection.md for external facts, task classification and errors.
# [selectors.adaptive]
# retry_seconds = 60
# recommendation_validity = "once" # or "sticky": once covers only the following dispatched unit (default); sticky stays valid while the task is unchanged.
# [[selectors.adaptive.rules]]
# candidates = [{profile = "primary"}, {profile = "alternate"}]
# [[selectors.adaptive.on_error]]
# when = {path = "error.code", op = "eq", value = "OPERATOR_CHOSEN_CODE"}
# scope = "profile"
# seconds = 300
# action = "fallback" # or "retry": same candidate up to `retries` attempts, then fallback.
# retries = 2         # same-candidate retry attempts for action = "retry" (0-64).
# [selectors.adaptive.classifier]
# profile = "alternate"
# policy = ["policies/shared.md", "policies/classifier.md"]
# on_failure = "continue"
# retry_seconds = 120
# [selectors.adaptive.classifier.attributes.difficulty]
# type = "string"
# values = ["easy", "hard"]
# Bounded current-work inputs for inference (defaults shown; 0 disables).
# [selectors.adaptive.classifier.inputs]
# max_proposals = 8
# max_decisions = 8
# max_text_bytes = 2048
